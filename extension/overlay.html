<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>AIndus: оверлей</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
      body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      /* layers from bottom to top: reel frame and fire -> 3D models -> falling particles (confetti, petals) -> web -> captions */
      #frame { z-index: 0; }
      #fire { z-index: 1; }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 2; }
      #fall { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 3; }
      #caption, #meter, #hud, #heart { z-index: 7; }
      .hidden { display: none !important; }

      :root { --hue: #ff9933; --hue2: #138808; }
      #frame { position: fixed; border-radius: 14px; pointer-events: none; opacity: 0;
        box-shadow: 0 0 0 3px var(--hue), 0 0 40px 12px color-mix(in srgb, var(--hue) 75%, transparent), inset 0 0 60px color-mix(in srgb, var(--hue) 35%, transparent);
        transition: opacity .3s; }
      #frame.on { opacity: 1; animation: frame-pulse 1.1s ease-in-out infinite alternate; }
      @keyframes frame-pulse {
        from { box-shadow: 0 0 0 3px var(--hue), 0 0 40px 12px color-mix(in srgb, var(--hue) 75%, transparent), inset 0 0 60px color-mix(in srgb, var(--hue) 35%, transparent); }
        to { box-shadow: 0 0 0 3px var(--hue2), 0 0 60px 20px color-mix(in srgb, var(--hue2) 70%, transparent), inset 0 0 90px rgba(255,255,255,.4); } }

      #caption { position: fixed; top: 6vh; left: 0; right: 0; text-align: center; opacity: 0; transform: scale(.6); transition: opacity .35s, transform .35s cubic-bezier(.2,1.6,.4,1); }
      #caption.on { opacity: 1; transform: scale(1); }
      #caption h1 { margin: 0; font-size: clamp(36px, 7vw, 96px); font-weight: 900; letter-spacing: .06em; line-height: 1;
        background: linear-gradient(90deg, #ff9933 0%, #ffffff 50%, #138808 100%); background-size: 200% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 4px 0 #7a2e00) drop-shadow(0 0 22px rgba(255,153,51,.9));
        animation: shimmer 1.6s linear infinite, wobble .55s ease-in-out infinite alternate; }
      @keyframes shimmer { to { background-position: -200% 0; } }
      @keyframes wobble { from { transform: rotate(-2.5deg) scale(1); } to { transform: rotate(2.5deg) scale(1.04); } }
      #caption p { margin: 10px 0 0; font-size: clamp(14px, 1.6vw, 22px); font-weight: 700; color: #fff;
        text-shadow: 0 2px 8px rgba(0,0,0,.8), 0 0 18px rgba(255,153,51,.8); }
      #caption p .song { display: block; font-weight: 500; opacity: .9; font-size: .85em; margin-top: 4px; }

      #flash { position: fixed; inset: 0; background: radial-gradient(circle, rgba(255,153,51,.85), rgba(255,20,147,.5) 60%, transparent 75%); opacity: 0; pointer-events: none; }
      #flash.on { animation: flash .9s ease-out forwards; }
      @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }


      #meter { position: fixed; left: 16px; bottom: 56px; width: 200px; padding: 8px 12px; border-radius: 12px; color: #fff; font-size: 12px; font-weight: 600;
        background: rgba(20,20,20,.82); border: 1px solid rgba(255,255,255,.15); box-shadow: 0 4px 16px rgba(0,0,0,.35);
        opacity: 0; transition: opacity .3s; }
      #meter.on { opacity: 1; }
      #meter .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
      #meter .row b { color: #ffb366; font-variant-numeric: tabular-nums; }
      #meter .bar { position: relative; height: 7px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
      #meter .fill { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #666, #ffb366); transition: width .25s; }
      #meter.hot .fill { background: linear-gradient(90deg, #ff9933, #ff1493); }
      #meter .thr { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; opacity: .8; }
      #meter .top { margin-top: 5px; color: #aaa; font-weight: 400; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* --- Instagram-style effects --- */
      #fire { position: fixed; inset: 0; pointer-events: none; }
      .flame { position: absolute; border-radius: 50%; background: radial-gradient(circle, #fff6c8 0%, #ffb020 45%, rgba(255,80,0,0) 72%);
        animation: rise linear forwards; will-change: transform, opacity; filter: drop-shadow(0 0 6px rgba(255,120,0,.9)); }
      @keyframes rise { 0% { transform: translateY(0) scale(.6) rotate(var(--rot)); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(var(--dy)) scale(1.3) rotate(calc(var(--rot) * -1)); opacity: 0; } }
      .confetti { position: absolute; width: 10px; height: 16px; border-radius: 2px; animation: confetti cubic-bezier(.2,.7,.3,1) forwards; will-change: transform, opacity; }
      @keyframes confetti { 0% { transform: translate(0,0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
      #heart { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0); font-size: 140px; pointer-events: none; opacity: 0;
        filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
      #heart.pop { animation: heartpop 1.1s cubic-bezier(.2,1.5,.4,1) forwards; }
      @keyframes heartpop { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 25% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 55% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-58%) scale(1.15); opacity: 0; } }
      .mini-heart { position: fixed; font-size: 26px; pointer-events: none; animation: miniheart 1.4s ease-out forwards; }
      @keyframes miniheart { 0% { transform: translate(0,0) scale(.5); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }
      #caption h1 { animation: shimmer 1.6s linear infinite, wobble .55s ease-in-out infinite alternate, flicker .12s steps(2) infinite; }
      @keyframes flicker { 50% { filter: drop-shadow(0 4px 0 #7a2e00) drop-shadow(0 0 30px rgba(255,120,0,1)); } }
      #webfx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 4; }
      #spcap { position: fixed; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none; z-index: 6; opacity: 0;
        font: 900 clamp(48px, 11vw, 190px)/1 -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .02em; color: #fdfdf6;
        -webkit-text-stroke: 3px #2b2b2b; text-shadow: 0 6px 0 #d9d9cf, 0 12px 24px rgba(0,0,0,.45); }
      #spcap.on { animation: spcap-pop .5s cubic-bezier(.2,1.6,.4,1) forwards, spcap-shake .12s linear .5s infinite alternate; }
      @keyframes spcap-pop { 0% { opacity: 0; transform: scale(.2) rotate(-8deg); } 100% { opacity: 1; transform: scale(1) rotate(-3deg); } }
      @keyframes spcap-shake { from { transform: scale(1) rotate(-3deg) translate(-2px, 1px); } to { transform: scale(1.03) rotate(-2deg) translate(2px, -1px); } }
      #hud { position: fixed; left: 16px; bottom: 16px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff;
        background: rgba(20,20,20,.82); border: 1px solid rgba(255,255,255,.15); box-shadow: 0 4px 16px rgba(0,0,0,.35);
        opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; max-width: 60vw; }
      #hud.on { opacity: 1; transform: none; }
      #hud.yes { background: linear-gradient(90deg, #ff9933, #d6336c); }
      #hud.no { background: rgba(40,40,40,.85); color: #bbb; }
      #hud.error { background: #7a1f1f; }
    </style>
  </head>
  <body>
    <canvas id="gl" class="hidden"></canvas>
    <canvas id="fall"></canvas>
    <canvas id="webfx"></canvas>
    <div id="spcap">СПУЩЕНКА!!!</div>
    <div id="flash"></div>
    <div id="fire"></div>
    <div id="heart">❤️</div>
    <div id="frame"></div>
    <div id="caption"><h1 id="title">ИИНДУИЗАЦИЯ</h1><p><span id="conf"></span><span class="song" id="song"></span></p></div>
    <div id="meter"><div class="row"><span>ИИндус смотрит</span><b id="mPct">0%</b></div><div class="bar"><div class="fill" id="mFill"></div><div class="thr" id="mThr"></div></div><div class="top" id="mTop"></div></div>
    <div id="hud"></div>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
